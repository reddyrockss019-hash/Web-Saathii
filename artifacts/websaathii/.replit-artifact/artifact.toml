kind = "web"
previewPath = "/"
title = "WebSaathii – AI Guided Website Builder"
version = "1.0.0"
id = "artifacts/websaathii"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19218

[services.development]
run = "pnpm --filter @workspace/websaathii run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/websaathii", "run", "build" ]
publicDir = "artifacts/websaathii/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19218"
BASE_PATH = "/"
